# ============================================================================
# Sincronização semanal do painel de recrutamento com o InHire
# ============================================================================
#
# POR QUE SEMANAL, E NÃO DIÁRIO
# Cada execução gasta ~161 requisições do balde do InHire, que é POR CONTA e
# compartilhado com o conector MCP que o time de recrutamento usa. Vaga não
# muda de estado tantas vezes ao dia a ponto de justificar o custo diário.
# Se a frequência precisar subir, o caminho certo é webhook em vez de varredura
# (ver docs/inhire-conexao-api.md), não simplesmente encurtar o intervalo.
#
# POR QUE SEGUNDA DE MANHÃ
# Para o número já estar atualizado quando alguém abrir o painel na segunda.
# 09:00 UTC = 06:00 em Brasília -- antes do expediente, quando o balde de
# requisições está livre.
#
# POR QUE workflow_dispatch TAMBÉM
# Para dar um botão de "rodar agora" no GitHub sem esperar a semana virar.
# Útil quando alguém corrige um departamento no InHire e quer ver refletido.
# ============================================================================

name: Sincronizar InHire

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

# Sem isto, duas execuções sobrepostas competiriam pelo mesmo balde de
# requisições -- e a segunda tomaria 429 por culpa da primeira.
concurrency:
  group: sync-inhire
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Chamar a rota de sincronização
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Faltam os secrets APP_URL e/ou CRON_SECRET no repositório."
            exit 1
          fi

          # -sS: sem barra de progresso, mas com erro visível.
          # O segredo vai em cabeçalho. Nunca na URL: a URL apareceria no log
          # público desta execução, e o log do GitHub Actions fica guardado.
          # --fail-with-body: sai com erro E mostra o corpo, para a mensagem do
          # servidor chegar aqui em vez de um "exit 22" mudo.
          curl -sS --fail-with-body \
            --max-time 900 \
            -X POST "${APP_URL%/}/api/cron/inhire-sync" \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            | tee resposta.json

          echo ""
          echo "--- Resumo ---"
          # jq já vem na imagem do runner.
          jq -r '"Vagas: \(.vagasRecebidas) | Com área: \(.vagasRecebidas - .semDepartamento) | Linhas mensais: \(.linhasMensais) | Requisições: \(.requisicoes) | Menor saldo: \(.menorSaldoLimite)"' resposta.json

          # Avisos não derrubam a execução, mas precisam ficar visíveis: são
          # eles que contam quando o de-para de departamento parou de bater.
          jq -r '.avisos[]? | "AVISO: \(.)"' resposta.json
